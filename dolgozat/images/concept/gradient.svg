<svg width="101" height="101" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="gray" stroke-width="1"/>
    </pattern>
    <linearGradient id="lin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="white"/>
      <stop offset="1" stop-color="steelblue"/>
    </linearGradient>
    <radialGradient id="rad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="gold"/>
      <stop offset="1" stop-color="tomato"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#smallGrid)" />
  <rect x="10" y="10" width="80" height="35" fill="url(#lin)" stroke="black" stroke-width="2"/>
  <circle cx="50" cy="72" r="20" fill="url(#rad)" stroke="black" stroke-width="2"/>
</svg>
